project:
  type: website
  output-dir: _site

website:
  title: "Ibasgo"
  description: "Portofolio Muhammad Ilham Basgoro, Epidemiolog & Analis Data"
  site-url: "https://ibasgo.github.io"
  navbar:
    background: light
    pinned: false
    right:
      - text: "Tentang"
        href: index.qmd
      - text: "Portofolio"
        href: portofolio.qmd
      - text: "Publikasi"
        href: publikasi.qmd
      - text: "Blog"
        href: blog.qmd
      - text: "CV"
        href: cv.qmd
      - icon: github
        href: https://github.com/ibasgo
        aria-label: GitHub
      - icon: linkedin
        href: https://linkedin.com/in/ilham-basgoro
